name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate SDF XML well-formedness
        run: |
          set -e
          xml_files=$(find src/Objects src/manifest.xml src/deploy.xml -name '*.xml' 2>/dev/null)
          if [ -z "$xml_files" ]; then
            echo "No XML files found"
            exit 1
          fi
          for f in $xml_files; do
            echo "Validating $f"
            xmllint --noout "$f"
          done

      - name: Validate JavaScript syntax
        run: |
          set -e
          js_files=$(find src/FileCabinet -name '*.js')
          if [ -z "$js_files" ]; then
            echo "No JS files found"
            exit 1
          fi
          for f in $js_files; do
            echo "Checking $f"
            node --check "$f"
          done
